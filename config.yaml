model:
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
  default: qwen/qwen4-max:free
web:
  backend: nous
browser:
  cloud_provider: nous
stt:
  provider: nous
onboarding:
  seen:
    openclaw_residue_cleanup: true
_config_version: 43
mcp_servers:
  mars_lms:
    command: C:/Users/user/Documents/Hermes-2/mcp-servers/mars_lms/.venv/Scripts/python.exe
    args:
      - C:/Users/user/Documents/Hermes-2/mcp-servers/mars_lms/server.py
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    enabled: true
    timeout: 180
    connect_timeout: 60
    tools:
      resources: false
      prompts: false
  # digital-org/mcp/servers.json bo'yicha ajratilgan domen serverlari.
  # Yoqish uchun enabled: true qiling (mars_lms bilan bir xil venv ishlatiladi).
  mars_finance:
    command: C:/Users/user/Documents/Hermes-2/mcp-servers/mars_lms/.venv/Scripts/python.exe
    args:
      - C:/Users/user/Documents/Hermes-2/mcp-servers/mars_finance/server.py
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    enabled: false
    timeout: 180
    connect_timeout: 60
    tools:
      resources: false
      prompts: false
  obsidian_rag:
    command: C:/Users/user/Documents/Hermes-2/mcp-servers/mars_lms/.venv/Scripts/python.exe
    args:
      - C:/Users/user/Documents/Hermes-2/mcp-servers/obsidian_rag/server.py
    env:
      OBSIDIAN_VAULT: C:/Users/user/Documents/Hermes-2/digital-org/memory/vault
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    enabled: false
    timeout: 120
    connect_timeout: 60
    tools:
      resources: false
      prompts: false
image_gen:
  provider: nous

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
