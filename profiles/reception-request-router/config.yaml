model:
  provider: nous
  default: qwen/qwen4-max:free
_config_version: 43
mcp_servers:
  mars_lms:
    command: ${PYTHONPATH}/../mcp-servers/mars_lms/.venv/Scripts/python.exe
    args:
    - ${PYTHONPATH}/../mcp-servers/mars_lms/server.py
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    tools:
      include:
      - login
      - incoming_requests
      - reception_triage
      prompts: false
      resources: false
    timeout: 180
    connect_timeout: 60
platform_toolsets:
  cli:
  - mars_lms
delegation:
  max_concurrent_children: 3
  max_spawn_depth: 1
  orchestrator_enabled: false
